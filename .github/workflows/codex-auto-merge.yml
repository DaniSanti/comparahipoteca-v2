name: Codex auto merge

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: codex-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      startsWith(github.event.pull_request.head.ref, 'codex/') &&
      github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check whitespace
        run: git diff --check

  merge:
    needs: validate
    if: >-
      !startsWith(github.event.pull_request.head.ref, 'codex/review-') ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_IS_DRAFT: ${{ github.event.pull_request.draft }}
    steps:
      - name: Mark pull request ready
        if: env.PR_IS_DRAFT == 'true'
        run: gh pr ready "$PR_URL"

      - name: Enable squash auto-merge
        shell: bash
        run: |
          max_attempts=4
          for ((attempt=1; attempt<=max_attempts; attempt++)); do
            if output=$(gh pr merge "$PR_URL" --auto --squash --delete-branch 2>&1); then
              printf '%s\n' "$output"
              exit 0
            else
              status=$?
              printf '%s\n' "$output" >&2
            fi

            if [[ "${output,,}" != *"pull request is in unstable status"* ]] ||
               (( attempt == max_attempts )); then
              exit "$status"
            fi

            echo "GitHub is still updating the pull request; retrying in 5 seconds ($attempt/$max_attempts)."
            sleep 5
          done
